name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Windows x64 Build & Test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun run test

      - name: Verify Windows platform test suite
        run: bun run test windows/tests/windows-platform.test.ts

      - name: Run Windows setup validation
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File windows/setup.ps1 -SkipInstall

      - name: Build server sidecar and frontend app
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File windows/build.ps1 -Portable

      - name: Verify build outputs
        shell: powershell
        run: |
          if (-not (Test-Path "dist/windows-portable/sheet-server.exe")) {
            throw "Missing compiled sheet-server.exe in portable package"
          }
          if (-not (Test-Path "dist/windows-portable/app/index.html")) {
            throw "Missing frontend dist in portable package"
          }
          Write-Host "[OK] All Windows release artifacts verified."
